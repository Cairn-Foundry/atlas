name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Front: lint, types (against the contract the daemon generates), tests, build.
  front:
    name: Front
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm web:build

  # Daemon and shared crates: format, lints, tests (unit, real PTY and real git), on the three
  # systems Atlas runs on.
  rust:
    name: Rust (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The oldest compiler Cargo.toml promises (rust-version) still builds the daemon and its crates.
  msrv:
    name: MSRV
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: rustup toolchain install 1.89 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +1.89 check --all-targets --locked

  # The desktop shell is outside the default members: it needs the system webview libraries. The
  # front and the daemon it embeds are stood in for by empty files, which is enough to lint it.
  desktop:
    name: Desktop shell
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
          version: 1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Stand in for the front and the daemon sidecar
        run: |
          mkdir -p front/dist crates/atlas-desktop/binaries
          touch "crates/atlas-desktop/binaries/atlas-daemon-$(rustc -vV | sed -n 's/^host: //p')"
      - run: cargo clippy -p atlas-desktop --all-targets --locked -- -D warnings
        working-directory: crates
      - run: cargo test -p atlas-desktop --locked
        working-directory: crates

  # Known vulnerabilities in the dependencies, on a schedule: a new advisory never blocks a merge.
  audit:
    name: Audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: crates
