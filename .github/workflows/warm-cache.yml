name: Warm build cache

# The release workflow only runs on tag pushes, and a tag ref can only restore caches saved on that
# same ref or on the default branch. Without a cache saved on main, every release would compile
# Rust from scratch on all six targets. This job runs the same compile on main and leaves the cache
# where the next tag build finds it. The matrix must stay identical to the one in release.yml.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - ".github/workflows/warm-cache.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { artifact: bundle-linux-x86_64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { artifact: bundle-linux-aarch64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { artifact: bundle-macos-aarch64, runner: macos-latest, target: aarch64-apple-darwin }
          - { artifact: bundle-macos-x86_64, runner: macos-latest, target: x86_64-apple-darwin }
          - { artifact: bundle-windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { artifact: bundle-windows-aarch64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Linux dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config patchelf xdg-utils
          version: 1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: front/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates
          shared-key: ${{ matrix.artifact }}
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile
        working-directory: front

      - name: Build
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle
        working-directory: front
