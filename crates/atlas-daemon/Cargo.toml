[package]
name = "atlas-daemon"
description = "Atlas, by Cairn Foundry - the daemon of the agent factory: registry, sessions, orchestrator, MCP servers and HTTP API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
atlas-i18n = { path = "../atlas-i18n" }
atlas-link = { path = "../atlas-link" }
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
foundry-git = { path = "../foundry-git" }
foundry-pty = { path = "../foundry-pty" }
indexmap = { version = "2", features = ["serde"] }
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
schemars = { version = "1.2.3", features = ["indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.11"
thiserror.workspace = true
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
notify-rust = "4"

[dev-dependencies]
atlas-i18n = { path = "../atlas-i18n", features = ["ts"] }
futures-util = "0.3.34"
tempfile = "3"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
ts-rs = { version = "12.0.1", features = ["indexmap-impl"] }
